name: Market OS CI

on:
  pull_request:
    paths:
      - "market_radar/**"
      - ".github/workflows/market-os-ci.yml"
  push:
    branches:
      - "feature/market-os-live-v2"
    paths:
      - "market_radar/**"
      - ".github/workflows/market-os-ci.yml"

jobs:
  market-os:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "psycopg[binary]" requests websockets

      - name: Compile Market OS Python
        run: |
          python -m py_compile             market_radar/market_os_rule_engine.py             market_radar/market_os_learning.py             market_radar/market_os_store.py             market_radar/market_os_routes.py             market_radar/market_os_live_validation.py             market_radar/kiwoom_realtime_0b.py

      - name: Run Market OS unit tests
        working-directory: market_radar
        run: python -m unittest discover -s tests -p "test_market_os*.py" -v

      - name: Check browser JavaScript syntax
        run: |
          node --check market_radar/market_os_ui.js
          node --check market_radar/flow_ui.js

      - name: Validate rulebook JSON
        run: python -m json.tool market_radar/rulebook/market_os_rules.json >/dev/null
