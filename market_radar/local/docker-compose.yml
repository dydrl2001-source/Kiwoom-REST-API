services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_radar
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U market -d market_radar"]
      interval: 5s
      timeout: 5s
      retries: 20

  radar-api:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/radar_web_app.py
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  kiwoom-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/flow_collector.py
    depends_on:
      postgres:
        condition: service_healthy

  kiwoom-realtime:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/kiwoom_realtime_0b.py
    depends_on:
      postgres:
        condition: service_healthy
      kiwoom-feed:
        condition: service_started

  market-os-readonly:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python -m uvicorn market_os_readonly_app:app --host 0.0.0.0 --port 8081
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  market-os-daily:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/market_os_daily.py
    depends_on:
      postgres:
        condition: service_healthy

  market-os-learning:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/market_os_learning.py
    depends_on:
      postgres:
        condition: service_healthy
      kiwoom-feed:
        condition: service_started

  paper-trade-engine:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/paper_trade_engine.py
    depends_on:
      postgres:
        condition: service_healthy
      candidate-tracker:
        condition: service_started
      mimosa-engine:
        condition: service_started

  paper-feedback-engine:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/paper_feedback_engine.py
    depends_on:
      postgres:
        condition: service_healthy
      paper-trade-engine:
        condition: service_started

  candidate-tracker:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/candidate_tracker.py
    depends_on:
      postgres:
        condition: service_healthy
      kiwoom-feed:
        condition: service_started
      mimosa-engine:
        condition: service_started

  market-regime:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/market_regime_engine.py
    depends_on:
      postgres:
        condition: service_healthy

  market-theme-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/market_theme_feed.py
    depends_on:
      postgres:
        condition: service_healthy

  news-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/flow_news_feed.py
    depends_on:
      postgres:
        condition: service_healthy

  chart-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/flow_chart_feed.py
    depends_on:
      postgres:
        condition: service_healthy

  mimosa-engine:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/mimosa_engine.py
    depends_on:
      postgres:
        condition: service_healthy
      chart-feed:
        condition: service_started

  index-chart-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/index_chart_feed.py
    depends_on:
      postgres:
        condition: service_healthy

  dart-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/dart_feed.py
    depends_on:
      postgres:
        condition: service_healthy

  research-engine:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/research_engine.py
    depends_on:
      postgres:
        condition: service_healthy

  deep-research-engine:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/deep_research_engine.py
    depends_on:
      postgres:
        condition: service_healthy
      research-engine:
        condition: service_started

  web-research-worker:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/flow_research_worker.py
    depends_on:
      postgres:
        condition: service_healthy

  telegram-collector:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
      TELEGRAM_SESSION_PATH: /data/marketcollector
    command: python /app/telegram_collector.py
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  telegram-login:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    profiles: ["tools"]
    env_file: .env
    environment:
      TELEGRAM_SESSION_PATH: /data/marketcollector
    command: python /app/telegram_login.py
    stdin_open: true
    tty: true
    volumes:
      - ./data:/data

volumes:
  postgres_data:
