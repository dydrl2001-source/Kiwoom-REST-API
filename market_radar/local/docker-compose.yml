services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: market_radar
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U market -d market_radar"]
      interval: 5s
      timeout: 5s
      retries: 20

  schema-migrate:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/schema_migrate.py apply
    depends_on:
      postgres:
        condition: service_healthy

  radar-api:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/radar_web_app.py
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

  kiwoom-feed:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/flow_collector.py
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully

  candidate-tracker:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/candidate_tracker.py
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      kiwoom-feed:
        condition: service_started
      mimosa-engine:
        condition: service_started

  ai-brokerage-worker:
    build:
      context: ../..
      dockerfile: market_radar/local/Dockerfile
