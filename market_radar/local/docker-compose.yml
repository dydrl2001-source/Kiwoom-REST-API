      DATABASE_URL: postgresql://market:${POSTGRES_PASSWORD}@postgres:5432/market_radar
    command: python /app/ai_brokerage_worker.py
    depends_on:
      postgres:
        condition: service_healthy
      schema-migrate:
        condition: service_completed_successfully
      candidate-tracker:
        condition: service_started
      market-regime:
        condition: service_started
      mimosa-engine:
